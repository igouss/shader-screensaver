# Shader screensaver settings, read by screensaver-shaders and the launcher.

# Seconds each shader stays up in `screensaver-shaders cycle`
# (keys 1-9 change it while cycling; 0 means 10).
cycle_seconds=3

# Fraction of the screen's pixel size shaders render at (0.1-1). Lower is faster
# but blurrier; slow shaders also lower it on their own.
render_scale=1.0

# Frame-rate cap (0 = none; the display's refresh rate always caps it too).
# Lower it to save power and fan noise.
max_fps=30
