# Shader screensaver settings, read by screensaver-shaders and the launcher.

# Seconds each shader stays up in `screensaver-shaders cycle`
# (keys 1-9 change it while cycling; 0 means 10).
cycle_seconds=3

# Fraction of the screen's pixel size shaders render at (0.1-1). Lower is faster
# but blurrier. Shaders running below 80% of the frame-rate target also lower
# it on their own, rather than stutter.
render_scale=1.0

# Frame-rate cap (0 = none; the display's refresh rate always caps it too).
# Lower it to save power and fan noise.
max_fps=30

# The lock screen draws the same shaders (see `screensaver-shaders lock`).
# It renders inside the Omarchy shell, so it runs at a lower scale than the
# screensaver by default, and turns the display off after lock_blank_seconds
# without input (0 = never).
lock_render_scale=0.5
lock_blank_seconds=300
